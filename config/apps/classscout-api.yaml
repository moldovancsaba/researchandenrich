# ClassScout API App Configuration
appId: classscout-api
displayName: ClassScout API
description: NYC children's program research - classes, camps, drop-ins for ages 0-17

# API configuration
apiBase: https://classscout-api.vercel.app

# Verification uses list-based endpoints
verifier: runtime/verifier/list-based.js

# Schema mapper prevents cross-tenant field contamination
schemaMapper: runtime/schema-mapper.js

# Search router for web research
searchRouter:
  enabled: true
  runner: "$HOME/.openclaw/workspace/Agents/contentcreator/search-router/seyu-search-router/AgentFinder"
  engines: [parallel, youcom, wiby, waybackAvailable, waybackCdx, gdelt]
  fallback: web_fetch

# Health check endpoint template
healthCheckTemplate: "GET /api/programs?limit=1"

# Maximum records to process per run
maxResultsPerRun: 10

# ICE scoring disabled for program research
iceScoring: false

# Required fields for quality gate
requiredFields:
  - name
  - provider
  - borough
  - category
  - age_min
  - age_max
  - phone_or_email

# Borough validation required
requireBorough: true

# Age range constraint
ageRange:
  min: 0
  max: 17

# Allowed categories
categories:
  - sports
  - arts
  - stem
  - music
  - dance
  - language
  - academic
  - special-needs

# Allowed boroughs
boroughs:
  - Manhattan
  - Brooklyn
  - Queens
  - Bronx
  - Staten Island

# No revenue fields (program research, not sales)
forbiddenFields: []
