# Apps — Research domain groupings
# Each app groups tenants that share the same API, schema, and verification logic.
# Adding a new app = new research domain with different requirements.
# Adding a new tenant = new client within an existing app -- add it to the
# `tenants` list below AND give it a tenants.json entry with a matching
# `schemaFamily` ('sales-lead-api' for this app today); schema-mapper.js
# dispatches on that field, never on the tenant's own name/ID, so no code
# change is needed for a same-family tenant.

apps:
  researchandenrich:
    appId: researchandenrich
    displayName: ResearchEnrich
    description: Business and program research across sports, entertainment, media, and tech
    tenants: [cogmap, seyu, dvsc]
    verifier: runtime/verifier/list-based.js
    schemaMapper: schema-mapper.js
    healthCheckTemplate: "GET /api/leads?brand={{tenant}}&limit=1"
    maxResultsPerRun: 5
    requireDecisionMaker: true

  # A separate app: classscout targets a structurally different API (classscout's own
  # POST /api/ingest batch-operations endpoint, not salesleadgenerator's /api/leads), so
  # it does not share the researchandenrich app's verifier/healthCheckTemplate above.
  # schemaMapper.js is still the shared file -- it dispatches per-tenant on schemaFamily
  # ('program-api' here), same pattern as the researchandenrich app.
  classscout:
    appId: classscout
    displayName: ClassScout
    description: NYC kids-activity provider research (classes, camps, birthday parties, drop-ins) for classscout.ai's catalog
    tenants: [classscout]
    verifier: runtime/verifier/response-based.js
    schemaMapper: schema-mapper.js
    healthCheckTemplate: "GET /api/ingest"
    maxResultsPerRun: 5
    requireDecisionMaker: false
