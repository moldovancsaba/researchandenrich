tenant: classscout-api
operation: enrichment
prompt: prompts/enrichment/classscout-api.md
schedule:
  kind: every
  everyMs: 2700000
retry:
  maxAttempts: 3
  backoffMs: 5000
timeoutMs: 300000
dependencies: [classscout-api-discovery]
healthCheck:
  endpoint: GET /api/programs?limit=1
  expectedStatus: 200
